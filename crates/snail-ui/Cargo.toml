[package]
name = "snail-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Snail's pure UI model: no UI framework, only serde. Decided and tested without pixels."

# Everything that can be decided without pixels lives here so it is testable in seconds without
# building GPUI (plan.md §2). Chrono's pure date/time types keep calendar geometry and timezone
# fixtures deterministic; there is still no UI-framework dependency.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
