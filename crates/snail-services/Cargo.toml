[package]
name = "snail-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Snail's UI-agnostic services: sync scheduling, accounts/secrets, settings, notifications."

[dependencies]
snail-core = { path = "../snail-core" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
