[package]
name = "snail-services"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Snail's UI-agnostic services: sync scheduling, accounts/secrets, settings, notifications."

[dependencies]
snail-core = { path = "../snail-core" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "rt", "time"] }

[build-dependencies]
serde_json = { workspace = true }
