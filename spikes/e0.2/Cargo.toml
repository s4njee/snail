# E0.2 spike: gpui-kit `Input`/`Textarea` under real load (plan.md §3, E0.2).
#
# Its own workspace, so the app's Cargo.lock and frozen pin are untouched and this can test a
# candidate pair independently.
[workspace]

[package]
name = "snail-e0-2"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.6.4", default-features = true }
# gpui-kit depends on gpui-pre by semver, so pin the whole family exactly (plan.md §1.1).
gpui-pre = "=0.3.5"
gpui-pre-platform = "=0.3.5"
env_logger = "0.11"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2
