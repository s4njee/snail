<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
</helmet>
<div style="height:52px; flex:none; display:flex; align-items:center; gap:14px; padding:0 14px; background:#FAFAFA; border-bottom:1px solid #E0E0E0; font-family:'Bricolage Grotesque',system-ui,sans-serif; color:#1A1A1A;">

  <div style="display:flex; align-items:center; gap:8px; padding-right:4px;">
    <div style="width:16px; height:16px; border-radius:4px; background:#1A1A1A;"></div>
    <span style="font-size:14px; font-weight:600; letter-spacing:-0.01em;">Almanac</span>
  </div>

  <div style="display:flex; align-items:center; gap:2px; padding:3px; background:#EBEBEB; border-radius:9px;">
    <div style="padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:500; background:{{ mBg }}; color:{{ mFg }}; box-shadow:{{ mSh }};">Month</div>
    <div style="padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:500; background:{{ wBg }}; color:{{ wFg }}; box-shadow:{{ wSh }};">Week</div>
    <div style="padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:500; background:{{ tBg }}; color:{{ tFg }}; box-shadow:{{ tSh }};">3-day</div>
    <div style="padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:500; background:{{ dBg }}; color:{{ dFg }}; box-shadow:{{ dSh }};">Day</div>
    <div style="padding:5px 11px; border-radius:6px; font-size:12.5px; font-weight:500; background:{{ aBg }}; color:{{ aFg }}; box-shadow:{{ aSh }};">Agenda</div>
  </div>

  <div style="flex:1;"></div>

  <div style="display:flex; align-items:center; gap:8px; width:230px; height:30px; padding:0 10px; border:1px solid #E0E0E0; border-radius:8px; background:#FFFFFF;">
    <div style="width:11px; height:11px; border:1.5px solid #A0A0A0; border-radius:50%;"></div>
    <span style="font-family:'DM Mono',monospace; font-size:11.5px; color:#A0A0A0;">Search or type a date</span>
    <div style="flex:1;"></div>
    <span style="font-family:'DM Mono',monospace; font-size:10.5px; color:#BFBFBF;">⌘K</span>
  </div>

  <div style="display:flex; align-items:center; gap:7px; height:30px; padding:0 12px; border-radius:8px; background:#1F6FEB; color:#FFFFFF; font-size:12.5px; font-weight:500;">
    <span style="font-size:14px; line-height:1;">+</span>
    <span>New event</span>
  </div>

  <div style="width:1px; height:20px; background:#E0E0E0; margin:0 2px;"></div>

  <div style="display:flex; align-items:center; gap:14px; color:#888888;">
    <div style="width:11px; height:1.5px; background:currentColor;"></div>
    <div style="width:10px; height:10px; border:1.5px solid currentColor; border-radius:2px;"></div>
    <div style="width:12px; height:12px; position:relative;">
      <div style="position:absolute; top:5px; left:0; width:12px; height:1.5px; background:currentColor; transform:rotate(45deg);"></div>
      <div style="position:absolute; top:5px; left:0; width:12px; height:1.5px; background:currentColor; transform:rotate(-45deg);"></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:52},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Month&quot;,&quot;Week&quot;,&quot;3-day&quot;,&quot;Day&quot;,&quot;Agenda&quot;],&quot;default&quot;:&quot;Month&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "Month";
    const on = { Month: "m", Week: "w", "3-day": "t", Day: "d", Agenda: "a" }[active];
    const out = {};
    ["m", "w", "t", "d", "a"].forEach(k => {
      const is = k === on;
      out[k + "Bg"] = is ? "#FFFFFF" : "transparent";
      out[k + "Fg"] = is ? "#1A1A1A" : "#777777";
      out[k + "Sh"] = is ? "0 1px 2px rgba(0,0,0,0.10)" : "none";
    });
    return out;
  }
}

</script>
</body>
</html>
