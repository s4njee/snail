<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
</helmet>
<div style="width:264px; flex:none; height:100%; display:flex; flex-direction:column; background:#F4F4F4; border-right:1px solid #E0E0E0; font-family:'Bricolage Grotesque',system-ui,sans-serif; color:#1A1A1A;">

  <div style="padding:18px 18px 14px;">
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;">
      <span style="font-size:14px; font-weight:600; letter-spacing:-0.01em;">August 2026</span>
      <div style="display:flex; gap:12px; color:#A0A0A0; font-family:'DM Mono',monospace; font-size:12px;">
        <span>‹</span>
        <span>›</span>
      </div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:1px 0; font-family:'DM Mono',monospace; font-size:9.5px; color:#A0A0A0; letter-spacing:0.06em; margin-bottom:4px;">
      <div style="text-align:center;">S</div>
      <div style="text-align:center;">M</div>
      <div style="text-align:center;">T</div>
      <div style="text-align:center;">W</div>
      <div style="text-align:center;">T</div>
      <div style="text-align:center;">F</div>
      <div style="text-align:center;">S</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">
      <sc-for list="{{ mini }}" as="c" hint-placeholder-count="42">
        <div style="height:27px; display:flex; align-items:center; justify-content:center; border-radius:6px; font-family:'DM Mono',monospace; font-size:11.5px; color:{{ c.fg }}; background:{{ c.bg }}; font-weight:{{ c.fw }};">{{ c.d }}</div>
      </sc-for>
    </div>
  </div>

  <div style="height:1px; background:#E0E0E0; margin:0 18px;"></div>

  <div style="padding:16px 18px;">
    <div style="font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.12em; color:#A0A0A0; margin-bottom:10px;">CALENDARS</div>
    <div style="display:flex; flex-direction:column; gap:9px;">
      <sc-for list="{{ cals }}" as="k" hint-placeholder-count="6">
        <div style="display:flex; align-items:center; gap:9px;">
          <div style="width:12px; height:12px; border-radius:3.5px; flex:none; background:{{ k.fill }}; border:1.5px solid {{ k.color }};"></div>
          <span style="font-size:12.5px; color:{{ k.fg }};">{{ k.name }}</span>
          <div style="flex:1;"></div>
          <span style="font-family:'DM Mono',monospace; font-size:10.5px; color:#BFBFBF;">{{ k.n }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="height:1px; background:#E0E0E0; margin:0 18px;"></div>

  <div style="padding:16px 18px; flex:1; min-height:0;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
      <span style="font-family:'DM Mono',monospace; font-size:9.5px; letter-spacing:0.12em; color:#A0A0A0;">TASKS</span>
      <span style="font-family:'DM Mono',monospace; font-size:11px; color:#A0A0A0;">+</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:11px;">
      <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="5">
        <div style="display:flex; align-items:flex-start; gap:9px;">
          <div style="width:13px; height:13px; margin-top:1px; border-radius:50%; flex:none; border:1.5px solid {{ t.ring }}; background:{{ t.fill }};"></div>
          <div style="display:flex; flex-direction:column; gap:2px;">
            <span style="font-size:12.5px; line-height:1.3; color:{{ t.fg }}; text-decoration:{{ t.dec }};">{{ t.name }}</span>
            <span style="font-family:'DM Mono',monospace; font-size:10px; color:{{ t.metaFg }};">{{ t.due }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding:13px 18px; border-top:1px solid #E0E0E0; display:flex; align-items:center; gap:9px;">
    <div style="width:7px; height:7px; border-radius:50%; background:#0F766E; flex:none;"></div>
    <div style="display:flex; flex-direction:column; gap:1px;">
      <span style="font-size:11.5px; font-weight:500;">3 accounts synced</span>
      <span style="font-family:'DM Mono',monospace; font-size:9.5px; color:#A0A0A0;">last 2 min ago</span>
    </div>
    <div style="flex:1;"></div>
    <div style="display:flex; flex-direction:column; gap:2.5px; align-items:center;">
      <div style="width:3px; height:3px; border-radius:50%; background:#A0A0A0;"></div>
      <div style="width:3px; height:3px; border-radius:50%; background:#A0A0A0;"></div>
      <div style="width:3px; height:3px; border-radius:50%; background:#A0A0A0;"></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:264,&quot;height&quot;:848},&quot;sel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;13&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sel = String(this.props.sel || "13");
    const mini = [];
    [26, 27, 28, 29, 30, 31].forEach(d => mini.push({ d: String(d), dim: true }));
    for (let d = 1; d <= 31; d++) mini.push({ d: String(d) });
    [1, 2, 3, 4, 5].forEach(d => mini.push({ d: String(d), dim: true }));
    const cells = mini.map(c => {
      const isSel = !c.dim && c.d === sel;
      const isToday = !c.dim && c.d === "13";
      return {
        d: c.d,
        bg: isToday ? "#1F6FEB" : isSel ? "#E4EBF8" : "transparent",
        fg: isToday ? "#FFFFFF" : c.dim ? "#BFBFBF" : "#424242",
        fw: isToday || isSel ? "500" : "400"
      };
    });

    const cals = [
      ["Classes", "#C2410C", 18, true],
      ["Personal", "#1F6FEB", 24, true],
      ["Work shifts", "#0F766E", 9, true],
      ["Birthdays", "#7C5CBF", 4, true],
      ["Home", "#A16207", 6, true],
      ["US Holidays", "#888888", 2, false]
    ].map(([name, color, n, on]) => ({
      name, color, n: String(n),
      fill: on ? color : "transparent",
      fg: on ? "#1A1A1A" : "#A0A0A0"
    }));

    const tasks = [
      ["Lab report — draft 2", "Due today · 17:00", "over"],
      ["Read Ch. 4–6, Stats", "Tomorrow", "open"],
      ["Renew bus pass", "Sat 15 Aug", "open"],
      ["Email advisor", "Done 11:20", "done"]
    ].map(([name, due, s]) => ({
      name, due,
      ring: s === "done" ? "#BFBFBF" : s === "over" ? "#C2410C" : "#B3B3B3",
      fill: s === "done" ? "#BFBFBF" : "transparent",
      fg: s === "done" ? "#A0A0A0" : "#1A1A1A",
      dec: s === "done" ? "line-through" : "none",
      metaFg: s === "over" ? "#C2410C" : "#A0A0A0"
    }));

    return { mini: cells, cals, tasks };
  }
}

</script>
</body>
</html>
